<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metro Vancouver Weekly Grocery Flyers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body { margin:0; font-family: Inter, Arial, sans-serif; background:#f5f7fb; color:#1f2937; }
    .wrap { max-width:1200px; margin:0 auto; padding:20px; }
    .hero { background:linear-gradient(135deg,#0f4c81,#1d7cc2); color:#fff; border-radius:14px; padding:18px 20px; }
    .hero h1 { margin:0 0 6px; }
    .hero p { margin:0; opacity:.95; }
    #map { height: 560px; border-radius: 12px; border:1px solid #dbe2ea; margin-top:14px; }
    .note { font-size:13px; color:#64748b; margin-top:8px; }
  
    
    .region-label{background:rgba(255,255,255,.92);border:1px solid #d1d5db;color:#0f172a;font-weight:600;font-size:12px;padding:2px 6px;border-radius:6px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>Metro Vancouver Weekly Grocery Flyers</h1>
      <p>Click a region marker to open store flyers.</p>
    </div>
    <div id="map"></div>
    <div class="note">Map data © OpenStreetMap contributors · Built with Leaflet.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([49.255, -123.12], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const regions = [
      { slug:'downtown', name:'Downtown Vancouver', lat:49.2818, lng:-123.1165, labelDir:'right', labelOffset:[6,-4] },
      { slug:'west-end', name:'West End', lat:49.2868, lng:-123.1330, labelDir:'top', labelOffset:[0,-12] },
      { slug:'kitsilano', name:'Kitsilano', lat:49.268, lng:-123.168 },
      { slug:'mount-pleasant', name:'Mount Pleasant', lat:49.262, lng:-123.100 },
      { slug:'east-vancouver', name:'East Vancouver (Commercial Drive)', lat:49.268, lng:-123.070 },
      { slug:'south-vancouver-sunset', name:'South Vancouver (Sunset)', lat:49.222, lng:-123.091 },
      { slug:'marpole', name:'Marpole', lat:49.211, lng:-123.132 },
      { slug:'ubc-west-point-grey', name:'UBC / West Point Grey', lat:49.266, lng:-123.250 }
    ];

    regions.forEach(r => {
      const marker = L.marker([r.lat, r.lng]).addTo(map);
      const href = `./region/${r.slug}.html`;
      marker.on('click', () => { window.location.href = href; });
      marker.bindTooltip(r.name, { permanent: true, direction: r.labelDir || 'top', offset: r.labelOffset || [0, -10], className: 'region-label' });
    });
  </script>
</body>
</html>
