<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marpole · Weekly Grocery Flyers</title><style>
:root{--bg:#f5f7fb;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#0f4c81;--brand2:#1d7cc2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 6px 20px rgba(15,76,129,.25)}
.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0;opacity:.95}
.section-title{margin:20px 2px 10px;color:#334155;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:block;text-decoration:none;color:inherit;transition:.15s transform,.15s box-shadow}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.08)}
.card h3{margin:0 0 6px;font-size:20px;color:#0b4e8a}
.muted{color:var(--muted);font-size:13px}
.back{display:inline-block;margin:14px 0 4px;color:#0b4e8a;text-decoration:none;font-weight:600}
.store{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.store h3{margin:0 0 4px}
.actions a{display:inline-block;margin-top:8px;padding:7px 10px;background:#0b4e8a;color:#fff;border-radius:8px;text-decoration:none;font-size:13px}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;margin-right:8px}
.updated{background:#e7f8ee;color:#136d3d}.pending{background:#fff5e5;color:#8a5a00}.broken{background:#fdecec;color:#8a1f1f}.no_update{background:#eef2ff;color:#3730a3}
.thumb{width:100%;height:130px;border:1px dashed #cfd8e3;background:#f8fafc;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px;margin:10px 0}
</style></head><body><div class="wrap"><a class="back" href="../index.html">← Back to regions</a><div class="hero"><h1>Marpole</h1><p>Layer 2: Stores · Layer 3: Flyers</p></div><div class='store'><h3>No stores added yet</h3><div class='muted'>Add stores in <code>site/data/stores_by_region.json</code>.</div></div></div></body></html>
